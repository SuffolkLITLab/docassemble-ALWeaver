repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run --no-sync black
        language: system
        types: [python]
        exclude: ^(.*(/)?)?(__init__|setup)\.py$

  - repo: local
    hooks:
      - id: mypy
        name: mypy (type check)
        entry: uv run --no-sync mypy . --exclude '^build/' --explicit-package-bases
        language: system
        pass_filenames: false
        files: ^.*\.py$

      - id: js-checks
        name: JavaScript static checks (Prettier, ESLint, TypeScript)
        entry: npm run check
        language: system
        pass_filenames: false
        files: ^(docassemble/ALWeaver/data/static/.*\.js|tsconfig\.json|eslint\.config\.mjs|package\.json)$

      - id: pytest
        name: pytest (unit tests)
        entry: bash -c 'ISUNITTEST=true uv run --no-sync pytest'
        language: system
        pass_filenames: false
        files: ^(docassemble/.*|conftest\.py|pyproject\.toml)$

      - id: dayamlchecker
        name: dayamlchecker (validate YAML interviews)
        entry: uv run --no-sync dayamlchecker --no-url-check
        language: system
        types: [yaml]
        files: ^docassemble/.*/data/questions/.*\.ya?ml$

      - id: check-do-not-preload
        name: check test files for '# do not pre-load'
        entry: uv run --no-sync python scripts/check_do_not_preload.py
        language: system
        files: ^docassemble/.*/(test_.*|.*_test)\.py$
